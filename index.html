<!doctype html>
<html lang="bn" data-theme="paira">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved (or system) colour theme before the page paints to avoid a flash
      try {
        var saved = localStorage.getItem('paira-theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.setAttribute('data-theme', dark ? 'paira-dark' : 'paira')
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173d33" />
    <meta name="description" content="পায়রা পাবলিক লাইব্রেরী এবং কালচারাল সেন্টার, ট্যাকেরঘাট — বই, জ্ঞান, সংস্কৃতি ও মানবতার পথে। Paira Public Library & Cultural Center, Takerghat." />

    <!-- Link previews (Facebook, WhatsApp, Messenger, X). VITE_SITE_URL is set in .env.production -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="পায়রা" />
    <meta property="og:title" content="পায়রা | পাবলিক লাইব্রেরী এবং কালচারাল সেন্টার" />
    <meta property="og:description" content="বই, জ্ঞান, সংস্কৃতি ও মানবতার পথে — ট্যাকেরঘাটের পাঠাগার ও সাংস্কৃতিক কেন্দ্র।" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="bn_BD" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hind+Siliguri:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>পায়রা | পাবলিক লাইব্রেরী এবং কালচারাল সেন্টার</title>
  </head>
  <body>
    <noscript>পায়রা ওয়েবসাইট দেখতে JavaScript চালু করুন। / Please enable JavaScript to view this site.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
