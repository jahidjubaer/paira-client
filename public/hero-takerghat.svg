<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title">
  <title id="title">Doves flying from an open book over the hills and lake of Takerghat</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e6"/>
      <stop offset="0.6" stop-color="#f8dcaa"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fbcc2"/>
      <stop offset="1" stop-color="#1d7782"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.7" stop-color="#f5b14c"/>
      <stop offset="1" stop-color="#f5b14c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff3c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f3b33" flood-opacity="0.35"/>
    </filter>
    <g id="dove" filter="url(#soft)">
      <path d="M8 62 C 28 50, 52 50, 68 55 C 78 48, 88 46, 96 51 C 91 55, 86 57, 81 59 C 72 72, 46 76, 26 71 L 4 80 L 12 67 Z" fill="#ffffff"/>
      <path d="M34 56 C 38 30, 54 13, 78 4 C 70 24, 63 42, 56 56 Z" fill="#f2f2ee"/>
      <path d="M40 57 C 30 38, 22 28, 8 20 C 12 36, 20 48, 30 58 Z" fill="#e4e6e1"/>
      <circle cx="89" cy="52" r="1.8" fill="#1f3b33"/>
      <path d="M96 51 L 102 52 L 96 54 Z" fill="#e9a23b"/>
    </g>
  </defs>

  <!-- sky + sun -->
  <rect width="800" height="1000" fill="url(#sky)"/>
  <circle cx="560" cy="300" r="150" fill="url(#sun)"/>
  <circle cx="560" cy="300" r="78" fill="#f7b955"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="170" cy="190" rx="70" ry="16"/>
    <ellipse cx="215" cy="178" rx="40" ry="14"/>
    <ellipse cx="660" cy="150" rx="55" ry="12"/>
  </g>

  <!-- Meghalaya hills, far to near -->
  <path d="M0 470 C 120 395, 200 380, 300 420 S 470 350, 570 395 S 720 370, 800 410 L800 620 L0 620 Z" fill="#a9c2b8"/>
  <path d="M0 520 C 110 465, 220 455, 330 500 S 520 445, 640 488 S 760 470, 800 495 L800 630 L0 630 Z" fill="#6b9a8e"/>
  <path d="M0 585 C 150 540, 260 545, 380 575 S 620 538, 800 568 L800 640 L0 640 Z" fill="#2f6b5c"/>

  <!-- Niladri lake -->
  <rect y="610" width="800" height="160" fill="url(#lake)"/>
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.4">
    <line x1="470" y1="640" x2="620" y2="640" stroke-width="4"/>
    <line x1="520" y1="662" x2="590" y2="662" stroke-width="3"/>
    <line x1="80" y1="700" x2="170" y2="700" stroke-width="3"/>
    <line x1="600" y1="720" x2="720" y2="720" stroke-width="3"/>
    <line x1="340" y1="735" x2="420" y2="735" stroke-width="2"/>
  </g>

  <!-- fisherman's boat -->
  <g>
    <line x1="268" y1="596" x2="226" y2="700" stroke="#3b2a20" stroke-width="3" stroke-linecap="round"/>
    <rect x="244" y="632" width="13" height="24" rx="4" fill="#2b2420"/>
    <circle cx="250" cy="624" r="8" fill="#2b2420"/>
    <path d="M232 622 Q250 608 268 622 Z" fill="#c98b2b"/>
    <path d="M178 655 L322 655 Q300 682 250 684 Q200 682 178 655 Z" fill="#4a3226"/>
    <path d="M190 690 Q250 700 310 690" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.35"/>
  </g>

  <!-- green bank -->
  <path d="M0 760 Q 200 735 400 755 T 800 748 L800 1000 L0 1000 Z" fill="#1f5a48"/>
  <path d="M0 800 Q 220 780 420 800 T 800 795 L800 1000 L0 1000 Z" fill="#174a3b"/>
  <g stroke="#3f8a6c" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="790" x2="66" y2="772"/><line x1="72" y1="792" x2="72" y2="770"/><line x1="84" y1="790" x2="80" y2="773"/>
    <line x1="700" y1="785" x2="706" y2="767"/><line x1="712" y1="787" x2="712" y2="765"/><line x1="724" y1="785" x2="720" y2="768"/>
  </g>

  <!-- glow behind the book -->
  <ellipse cx="400" cy="860" rx="300" ry="140" fill="url(#glow)"/>

  <!-- open book -->
  <path d="M400 846 C 330 816, 240 816, 150 836 L150 952 C 240 932, 330 932, 400 962 C 470 932, 560 932, 650 952 L650 836 C 560 816, 470 816, 400 846 Z" fill="#b4432f"/>
  <path d="M400 832 C 340 802, 252 802, 168 822 L168 934 C 252 914, 340 914, 400 944 Z" fill="#fffaf0"/>
  <path d="M400 832 C 460 802, 548 802, 632 822 L632 934 C 548 914, 460 914, 400 944 Z" fill="#fbf2df"/>
  <line x1="400" y1="832" x2="400" y2="944" stroke="#e2d3b4" stroke-width="2"/>
  <g stroke="#dccaa6" stroke-width="3" stroke-linecap="round">
    <path d="M200 848 C 260 836, 320 838, 376 856" fill="none"/>
    <path d="M200 868 C 260 856, 320 858, 376 876" fill="none"/>
    <path d="M200 888 C 260 876, 320 878, 376 896" fill="none"/>
    <path d="M424 856 C 480 838, 540 836, 600 848" fill="none"/>
    <path d="M424 876 C 480 858, 540 856, 600 868" fill="none"/>
    <path d="M424 896 C 480 878, 540 876, 560 880" fill="none"/>
  </g>

  <!-- flight path -->
  <path d="M400 830 C 420 760, 360 700, 420 620 S 380 480, 470 400" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.8"/>

  <!-- doves (পায়রা) -->
  <use href="#dove" transform="translate(395 735) scale(0.55)"/>
  <use href="#dove" transform="translate(300 560) scale(0.85) rotate(-8)"/>
  <use href="#dove" transform="translate(455 440) scale(1.05) rotate(-14)"/>
  <use href="#dove" transform="translate(250 330) scale(0.7) rotate(-6)"/>
</svg>
